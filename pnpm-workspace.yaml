allowBuilds:
  esbuild: true
  puppeteer: true

packages:
  - src/themes/*

# single source of truth for dependency versions, every package.json references
# them with "catalog:" so the whole workspace upgrades in one place
catalog:
  '@jsonresume/jsonresume-theme-tokyo-modernist': ^1.0.7
  '@jsonresume/schema': ^1.3.1
  '@types/node': ^26.4.0
  '@vitest/coverage-v8': ^4.1.11
  ajv: ^8.20.0
  ajv-formats: ^3.0.1
  astro: ^7.2.9
  jsonresume-theme-berlin-grid: ^0.2.5
  jsonresume-theme-modern-classic: ^1.1.4
  oxfmt: ^0.65.0
  oxlint: ^1.80.0
  oxlint-tsgolint: ^7.0.2001
  puppeteer: ^25.9.0
  react: ^19.2.8
  react-dom: ^19.2.8
  resumed: ^6.1.0
  serve: ^14.2.6
  shuutils: ^10.6.0
  turbo: ^2.10.12
  typescript: ^7.0.2
  vitest: ^4.1.11

minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.3.8'
  - astro@7.2.6
